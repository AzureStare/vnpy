services:
  db:
    image: postgres:15-alpine
    container_name: vnpy_flagship_db
    environment:
      POSTGRES_USER: vnpy
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me}"
      POSTGRES_DB: vnpy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnpy -d vnpy"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vnpy_flagship_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Timezone for cron schedule
      TZ: America/New_York

      # Optional env overrides for Postgres (pg_ticker_db.py supports env override)
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_DATABASE: vnpy
      DATABASE_USER: vnpy
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:-change_me}"

      # Cron schedule inside container:
      # Run after market close (16:15 ET, Mon-Fri). The daily cycle will prepare signals and then
      # alpaca_executor will wait for the next open to place orders.
      FLAGSHIP_CRON_SCHEDULE: "15 16 * * 1-5"
      FLAGSHIP_CRON_COMMAND: "python -m flagship.trading.orchestration.daily_cycle_runner --strategy v7"
      # Intraday runner is now supervised by a always-on IntradayDaemon (program-driven, no cron).
      FLAGSHIP_ENABLE_INTRADAY_DAEMON: "1"
      FLAGSHIP_INTRADAY_START_HHMM: "09:35"
      # Legacy cron-based intraday start (disabled by default to avoid duplicates)
      FLAGSHIP_CRON_SCHEDULE_INTRADAY: ""
      FLAGSHIP_CRON_COMMAND_INTRADAY: ""
      # Limit WS watchlist to Top-N signals (+ positions + SPY)
      FLAGSHIP_INTRADAY_SIGNAL_TOPN: "10"
      # Portfolio heartbeat during RTH (every 5 minutes) - update portfolio + orders
      FLAGSHIP_CRON_SCHEDULE_PORTFOLIO: "*/1 9-16 * * 1-5"
      FLAGSHIP_CRON_COMMAND_PORTFOLIO: "python /app/flagship/monitoring/app_console_snapshot.py portfolio orders market_status"
      # Prometheus node_exporter textfile collector output (host-mounted via ./logs)
      FLAGSHIP_TEXTFILE_DIR: "/app/logs/metrics"
    volumes:
      # Mount current directory for easy updates without rebuild
      - .:/app
      # Persist AlphaLab data and logs
      - ./lab:/app/lab
      - ./logs:/app/logs
      # Inject your local vt_setting.json (DO NOT bake secrets into image)
      - ./vt_setting.json:/app/vt_setting.json:ro
    restart: unless-stopped

  # --- IBKR Gateway (Paper) ---
  # One IB Gateway instance per IBKR login (account). Keep it internal-only (no public port exposure).
  # Credentials MUST be provided via server-side .env (do not commit).
  ib_gateway_paper_01:
    # NOTE: Use actively maintained image (newer IB Gateway builds) for login compatibility.
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: vnpy_ib_gateway_paper_01
    environment:
      TRADING_MODE: "paper"
      TWS_USERID: "${IBKR_PAPER_01_USERID:-}"
      TWS_PASSWORD: "${IBKR_PAPER_01_PASSWORD:-}"
      # Ensure API connections are accepted (we also restrict via Trusted IPs/default container networking).
      TWS_ACCEPT_INCOMING: "accept"
      READ_ONLY_API: "no"
      # Optional: set to allow VNC debugging (leave empty to disable password auth depending on image defaults).
      VNC_SERVER_PASSWORD: "${IBKR_VNC_PASSWORD:-}"
      # Paper gateway typically listens on 4002 by default (inside container).
      # Expose internally to other containers; no host port mapping needed.
    restart: unless-stopped

  # --- Monitoring stack (Prometheus + Grafana) ---
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: vnpy_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./flagship/ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node_exporter
      - cadvisor
      - postgres_exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: vnpy_grafana
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      # Change this in your server .env (recommended)
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-change_me}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./flagship/ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: vnpy_node_exporter
    command:
      - "--path.rootfs=/host"
      - "--collector.textfile.directory=/textfile"
    volumes:
      - /:/host:ro,rslave
      # textfile collector: our scripts write *.prom into ./logs/metrics (host)
      - ./logs/metrics:/textfile
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: vnpy_cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: vnpy_postgres_exporter
    environment:
      # IMPORTANT: keep in sync with db service env
      DATA_SOURCE_NAME: "postgresql://vnpy:${POSTGRES_PASSWORD:-change_me}@db:5432/vnpy?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- Web DB Admin (pgAdmin) ---
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: vnpy_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-admin@flagship-strategy.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:-change_me}"
      PGADMIN_LISTEN_PORT: "80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # --- Reverse proxy (Caddy) for subdomains + HTTPS ---
  caddy:
    image: caddy:2.8.4
    container_name: vnpy_caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Used by Caddy for ACME registration (optional but recommended)
      CADDY_EMAIL: "admin@flagship-strategy.com"
      # Basic auth for sensitive endpoints (metrics/db). Use server .env to override.
      FLAGSHIP_BASIC_AUTH_USER: "${FLAGSHIP_BASIC_AUTH_USER:-admin}"
      FLAGSHIP_BASIC_AUTH_HASH: "${FLAGSHIP_BASIC_AUTH_HASH:-}"
    volumes:
      - ./flagship/ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./flagship/app_console/site:/srv/app:ro
      - ./logs/app:/srv/app_data:ro
    depends_on:
      - grafana
      - prometheus
      - pgadmin
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
  pgadmin_data:


